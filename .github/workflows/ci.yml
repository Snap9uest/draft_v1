name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      # Placeholders, not the real keys: the build only needs these to exist,
      # and a PR from a fork cannot read repository secrets anyway.
      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

      # Catches a key pasted into tracked source. .env files are ignored, so a
      # hit here means it reached a file that would ship.
      - name: Check for committed secrets
        run: |
          if git grep -nIE 'AIza[0-9A-Za-z_-]{35}|sbp_[0-9a-f]{40}|eyJhbGciOiJIUzI1NiIs' -- ':!*.md' ':!package-lock.json'; then
            echo "::error::A credential appears to be committed. Move it to .env.local and rotate the key."
            exit 1
          fi
